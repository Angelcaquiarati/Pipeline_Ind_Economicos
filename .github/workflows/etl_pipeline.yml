name: Pipeline ETL - Indicadores Econômicos

on:
  schedule:
    # Roda todo dia às 11h UTC (8h BRT)
    - cron: '0 11 * * *'
  workflow_dispatch:  # Permite rodar manualmente

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v3
    
    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests python-dotenv supabase
    
    - name: Rodar pipeline ETL
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python src/main.py
    
    - name: Commit e push dos backups (opcional)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add data/raw/
        git diff --staged --quiet || git commit -m "Backup automático dos dados [skip ci]"
        git push || echo "Sem alterações para commit"
