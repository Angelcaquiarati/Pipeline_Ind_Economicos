name: Pipeline ETL - Indicadores Econômicos

on:
  schedule:
    - cron: '0 11 * * *'  # 11h UTC = 8h BRT
  workflow_dispatch:

# 🔥 ADICIONAR PERMISSÕES
permissions:
  contents: read  # Apenas leitura (não faz push)

jobs:
  run-etl:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout do código
      uses: actions/checkout@v4  # Atualizado para v4
    
    - name: Configurar Python
      uses: actions/setup-python@v5  # Atualizado para v5
      with:
        python-version: '3.10'
    
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests python-dotenv supabase plotly
    
    - name: Rodar pipeline ETL
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        python src/main.py
    
    # 🔥 REMOVER A PARTE DE COMMIT (que causava o erro)
